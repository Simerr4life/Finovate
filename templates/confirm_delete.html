{% extends "base.html" %}
{% block title %}Confirm delete — Finovate{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
  <h1 class="text-xl font-bold mb-2">Delete this?</h1>
  <p class="text-sm text-slate-500 mb-6">{{ object }}</p>
  <form method="post" class="flex gap-3">
    {% csrf_token %}
    <button type="submit" class="bg-coral-600 text-white font-medium px-5 py-2 rounded-lg hover:bg-coral-500 focus-ring">Delete</button>
    <a href="{% url cancel_url %}" class="border border-slate-300 px-5 py-2 rounded-lg hover:bg-slate-100 focus-ring">Cancel</a>
  </form>
</div>
{% endblock %}
